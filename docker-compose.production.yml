# Standalone production file: DO NOT merge with docker-compose.yml.
# Requires HTTPS reverse proxy on the same host; bind port only to loopback.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-", "--error-logfile", "-"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "127.0.0.1:${PRODUCTION_LOCAL_PORT:-8089}:8000"
    volumes:
      - private_documents:/app/storage/private
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - private_documents:/app/storage/private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/celerybeat/celerybeat-schedule"]
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - celerybeat_data:/celerybeat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
  private_documents:
  static_files:
